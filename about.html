<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me - Fathima Zemar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Comfortaa:wght@700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: url('leopard-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #2b2b2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 45px 30px 35px;
      border-radius: 35px;
      max-width: 420px;
      width: 100%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .tape-top {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 110px;
      height: 28px;
      background: rgba(255, 255, 255, 0.6);
      border-left: 2px dashed rgba(0,0,0,0.1);
      border-right: 2px dashed rgba(0,0,0,0.1);
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    .tape-corner {
      position: absolute;
      bottom: -10px;
      right: 20px;
      width: 80px;
      height: 22px;
      background: rgba(255, 228, 225, 0.7);
      transform: rotate(-8deg);
      border-left: 2px dashed rgba(0,0,0,0.1);
      border-right: 2px dashed rgba(0,0,0,0.1);
    }

    .flower-sticker-1 {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 1.8rem;
      transform: rotate(-12deg);
    }

    .flower-sticker-2 {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 1.8rem;
      transform: rotate(15deg);
    }

    .polaroid {
      background: #ffffff;
      padding: 12px 12px 25px 12px;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transform: rotate(-3deg);
      display: inline-block;
      margin: 10px 0 20px;
      transition: transform 0.3s ease;
    }

    .polaroid:hover {
      transform: rotate(0deg) scale(1.03);
    }

    .polaroid img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 4px;
    }

    .polaroid-caption {
      font-family: 'Caveat', cursive;
      font-size: 1.4rem;
      color: #444;
      margin-top: 8px;
    }

    h1 {
      font-family: 'Comfortaa', cursive;
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: #1a1a1a;
    }

    .letter-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #444;
      background: rgba(255, 255, 255, 0.5);
      padding: 18px;
      border-radius: 20px;
      margin-bottom: 25px;
      text-align: left;
      border: 1px dashed #ccc;
    }

    .music-section {
      background: rgba(255, 255, 255, 0.7);
      padding: 20px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      margin-bottom: 25px;
    }

    .music-header {
      font-family: 'Comfortaa', cursive;
      font-size: 1.1rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .track {
      margin-bottom: 15px;
      text-align: left;
    }

    .track:last-child {
      margin-bottom: 0;
    }

    .track p {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    audio {
      width: 100%;
      height: 36px;
      border-radius: 20px;
    }

    .beacons-btn, .back-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      margin-bottom: 12px;
    }

    .beacons-btn {
      background: #000;
      color: #fff;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .beacons-btn:hover {
      background: #222;
      transform: translateY(-2px);
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.8);
      color: #333;
      border: 1px solid #ddd;
    }

    .back-btn:hover {
      background: #fff;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="tape-top"></div>
    <div class="tape-corner"></div>
    
    <span class="flower-sticker-1">🪷</span>
    <span class="flower-sticker-2">🌸</span>

    <div class="polaroid">
      <img src="3.jpg" alt="Profile Picture">
      <div class="polaroid-caption">fathima zemar ✨</div>
    </div>

    <h1>about me 🌷</h1>

    <div class="letter-text">
      <p>Hey there! Welcome to my small corner of the internet. I love music, aesthetic vibes, and creating pretty things. Thanks for stopping by! 🤍</p>
    </div>

    <div class="music-section">
      <div class="music-header">
        <span>🎧</span> my fav playlist 🌺
      </div>

      <div class="track">
        <p>🎵 Doja Cat - Woman</p>
        <audio controls src="Doja Cat - Woman (Lyrics).mp3"></audio>
      </div>

      <div class="track">
        <p>🎵 Favorite Track #2</p>
        <audio controls src="d61f-a7c3-4ff1-a3a3-bac43fb185ff.mp3"></audio>
      </div>
    </div>

    <a href="https://beacons.ai" target="_blank" class="beacons-btn">Visit My Beacons 🔗</a>
    <a href="index.html" class="back-btn">⬅ Back to Home</a>
  </div>

</body>
</html>
