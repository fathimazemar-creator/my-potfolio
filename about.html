<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Know More About Me</title>
  <style>
    body {
      background-image: url("leopard-bg.jpg");
      background-repeat: repeat;
      background-size: auto;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .profile-pic {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #ffb6c1;
    }

    .letter {
      background: #fff0f5;
      padding: 15px;
      border-radius: 12px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #444;
      margin: 15px 0;
    }

    .beacons-btn {
      display: inline-block;
      margin: 10px 0 20px 0;
      padding: 10px 20px;
      background-color: #ffb6c1;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 20px;
    }

    .music-section {
      border-top: 2px dashed #ffb6c1;
      padding-top: 15px;
      margin-top: 15px;
    }

    audio {
      width: 100%;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 1. Replace profile.jpg with your uploaded photo's filename -->
    <img src="profile.jpg" alt="Profile Picture" class="profile-pic">

    <h2>A Little Bit About Me 💌</h2>

    <div class="letter">
      <p>Hi there!</p>
      <p>Welcome to my page. Here is a little peek into my world, my personal style, and everything I love.</p>
    </div>

    <!-- 2. Replace YOUR_BEACONS_URL with your actual Beacons link -->
    <a href="YOUR_BEACONS_URL" target="_blank" class="beacons-btn">Visit My Beacons Hub</a>

    <div class="music-section">
      <h3>My Music Taste! 🎵</h3>

      <p>🎵 Playing: Woman - Doja Cat</p>
      <audio controls src="Doja Cat - Woman (Lyrics).mp3"></audio>

      <p>🎵 Playing: Love Like You</p>
      <audio controls src="d61f-a7c3-4ff1-a3a3-bac43fb185ff.mp3"></audio>
    </div>
  </div>

</body>
</html>
