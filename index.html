<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    body {
      background-image: url("leopard-bg.jpg");
      background-repeat: repeat;
      background-size: auto;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin-top: 0;
      color: #333;
    }

    p {
      color: #555;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #ffb6c1;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 25px;
      transition: background 0.3s ease;
    }

    .button:hover {
      background-color: #ff94a6;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome to My Page</h1>
    <p>Hi! Welcome to Fathima zemar's personal aesthetic corner of her web.</p>
    
    <a href="about.html" class="button">Know More About Me</a>
  </div>

</body>
</html>
