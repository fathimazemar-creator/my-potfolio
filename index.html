<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Fathima Zemar</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: url('leopard-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(5px);
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .avatar {
      width: 150px;
      height: auto;
      margin-bottom: 15px;
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .button:hover {
      background-color: #333;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="doll-removebg-preview.png" alt="Me" class="avatar">
    <h1>Welcome to My Page</h1>
    <p>Hi! Welcome to Fathima zemar's personal aesthetic corner of her web.</p>
    
    <a href="about.html" class="button">Know More About Me</a>
  </div>

</body>
</html>
